<!DOCTYPE html>
<html>
<head>
<title>Camera Test</title>
<style>
body{
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  font-family:Arial;
}
button{
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:#ff3b6f;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div>
  <h2>Hey Acchu ❤️</h2>
  <button onclick="start()">Allow & Start</button>
</div>

<script>
function start(){
  alert("Button clicked ✅");

  navigator.mediaDevices.getUserMedia({video:true,audio:true})
    .then(stream=>{
      alert("Camera allowed ✅");
    })
    .catch(err=>{
      alert("Permission blocked ❌");
      console.error(err);
    });
}
</script>

</body>
</html>
